# HTTP bootstrap for hosts that already run nginx. Install as
# /etc/nginx/sites-available/ai-designer, then enable it in sites-enabled.
# Enable HTTPS after DNS and public ports are ready:
# sudo certbot --nginx -d example.com -d www.example.com --redirect
# Do not send production logins over HTTP before enabling HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com www.example.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Replace client-supplied forwarding headers before applying IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
    }
}
